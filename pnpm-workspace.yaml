overrides:
  # react-native-css visitors broke against lightningcss 1.30.2 and >=1.32 as of
  # 3.0.7, and the 3.1.0-rc.0 install guide still pins 1.30.1; scoped so
  # tailwind's own exact lightningcss pin stays current.
  '@expo/metro-config>lightningcss': 1.30.1
publicHoistPattern:
  - '@babel/types'
allowBuilds:
  '@parcel/watcher': false
  '@shopify/react-native-skia': true
  react-native-nitro-modules: true
  unrs-resolver: false
# Our own packages are version-locked to the Tracearr release tag and built
# minutes after they publish, so pnpm 11's 24h release-age policy must not hold
# them back. Third-party packages keep the default.
minimumReleaseAgeExclude:
  - '@tracearr/*'
