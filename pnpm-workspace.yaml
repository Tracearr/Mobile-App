overrides:
  # react-native-css visitors broke against lightningcss 1.30.2 and >=1.32 as of
  # 3.0.7, and the 3.1.0-rc.0 install guide still pins 1.30.1; scoped so
  # tailwind's own exact lightningcss pin stays current.
  '@expo/metro-config>lightningcss': 1.30.1
publicHoistPattern:
  - '@babel/types'
allowBuilds:
  '@parcel/watcher': false
  '@posthog/cli': true
  '@shopify/react-native-skia': true
  react-native-nitro-modules: true
  unrs-resolver: false
# Our own packages are version-locked to the Tracearr release tag and built
# minutes after they publish, so pnpm 11's 24h release-age policy must not hold
# them back. Third-party packages keep the default.
minimumReleaseAgeExclude:
  - '@tracearr/*'
  - '@expo/cli@58.1.18'
  - '@expo/config@58.0.10'
  - '@expo/fingerprint@0.21.8'
  - '@expo/local-build-cache-provider@58.0.10'
  - '@expo/log-box@58.0.14'
  - '@expo/metro-config@58.0.20'
  - '@expo/metro-runtime@58.0.16'
  - '@expo/prebuild-config@58.0.18'
  - '@expo/router-server@58.0.20'
  - '@expo/schema-utils@58.0.3'
  - '@expo/ui@58.0.26'
  - babel-preset-expo@58.0.23
  - expo-background-task@58.0.12
  - expo-build-properties@58.0.12
  - expo-dev-client@58.0.18
  - expo-dev-launcher@58.0.18
  - expo-modules-core@58.0.29
  - expo-router@58.0.29
  - expo-task-manager@58.0.13
  - expo-updates@58.0.20
  - expo-widgets@58.0.26
  - expo@58.0.22
patchedDependencies:
  expo-widgets@58.0.26: patches/expo-widgets@58.0.26.patch
  react-native-css@3.1.0-rc.0: patches/react-native-css@3.1.0-rc.0.patch
