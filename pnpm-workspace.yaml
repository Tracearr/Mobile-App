overrides:
  # react-native-css visitors broke against lightningcss 1.30.2 and >=1.32 as of
  # 3.0.7, and the 3.1.0-rc.0 install guide still pins 1.30.1; scoped so
  # tailwind's own exact lightningcss pin stays current.
  '@expo/metro-config>lightningcss': 1.30.1
publicHoistPattern:
  - '@babel/types'
allowBuilds:
  '@parcel/watcher': false
  '@posthog/cli': true
  '@shopify/react-native-skia': true
  react-native-nitro-modules: true
  unrs-resolver: false
# Our own packages are version-locked to the Tracearr release tag and built
# minutes after they publish, so pnpm 11's 24h release-age policy must not hold
# them back. Third-party packages keep the default.
minimumReleaseAgeExclude:
  - '@tracearr/*'
  - expo@58.0.0-preview.6
  - expo-widgets@58.0.6
  - expo-notifications@58.0.6
  - expo-updates@58.0.8
  - expo-router@58.0.7
  - '@expo/ui@58.0.6'
  - expo-observe@58.0.8
  - expo-modules-core@58.0.6
  - '@expo/cli@58.0.6'
  - expo-dev-client@58.0.6
  - expo-constants@58.0.6
  - expo-linking@58.0.6
  - expo-task-manager@58.0.7
  - expo-background-task@58.0.6
  - expo-build-properties@58.0.6
  - '@expo/metro-runtime@58.0.6'
  - expo-asset@58.0.6
  - expo-image@58.0.5
  - expo-app-metrics@58.0.6
  - expo-dev-launcher@58.0.6
  - expo-dev-menu@58.0.6
patchedDependencies:
  expo-widgets@58.0.6: patches/expo-widgets@58.0.6.patch
