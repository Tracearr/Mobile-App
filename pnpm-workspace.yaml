overrides:
  # react-native-css visitors broke against lightningcss 1.30.2 and >=1.32 as of
  # 3.0.7, and the 3.1.0-rc.0 install guide still pins 1.30.1; scoped so
  # tailwind's own exact lightningcss pin stays current.
  '@expo/metro-config>lightningcss': 1.30.1
publicHoistPattern:
  - '@babel/types'
allowBuilds:
  '@parcel/watcher': false
  '@posthog/cli': true
  '@shopify/react-native-skia': true
  react-native-nitro-modules: true
  unrs-resolver: false
# Our own packages are version-locked to the Tracearr release tag and built
# minutes after they publish, so pnpm 11's 24h release-age policy must not hold
# them back. Third-party packages keep the default.
minimumReleaseAgeExclude:
  - '@tracearr/*'
  - '@expo/log-box@58.0.3'
  - '@expo/metro-runtime@58.0.3'
  - expo-app-metrics@58.0.3
  - expo-build-properties@58.0.3
  - expo-constants@58.0.3
  - expo-dev-client@58.0.3
  - expo-dev-launcher@58.0.3
  - expo-dev-menu@58.0.3
  - expo-linking@58.0.3
  - expo-notifications@58.0.3
  - expo-observe@58.0.5
  - expo-router@58.0.4
  - expo-task-manager@58.0.4
  - expo-updates@58.0.5
  - '@expo/ui@58.0.3'
  - expo-background-task@58.0.3
  - expo-widgets@58.0.3
  - '@expo/cli@58.0.3'
  - '@expo/metro-config@58.0.3'
  - babel-preset-expo@58.0.3
  - expo-asset@58.0.3
  - expo-modules-core@58.0.3
  - expo@58.0.0-preview.3
patchedDependencies:
  expo-widgets@58.0.3: patches/expo-widgets@58.0.3.patch
