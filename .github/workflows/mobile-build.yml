name: Mobile Build (Local)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tracearr tag to build (must be mirrored here first)'
        required: true
        type: string
      platform:
        description: 'Platform to build'
        required: true
        type: choice
        options: [android, ios, both]
        default: both
      profile:
        description: 'Build profile (auto derives from the tag)'
        required: true
        type: choice
        options: [auto, development, internal, beta, production]
        default: auto

concurrency:
  group: mobile-build
  cancel-in-progress: false

permissions:
  contents: read

# Pinned so local, CI and EAS all run the same CLI. Keep in step with
# EAS_CLI_VERSION in scripts/release/build.sh and eas-version in mobile-release.yml.
env:
  EAS_CLI_VERSION: '22.4.0'

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      profile: ${{ steps.resolve.outputs.profile }}
      marketing-version: ${{ steps.resolve.outputs.marketing-version }}
      tag: ${{ steps.tag.outputs.tag }}
      matrix: ${{ steps.resolve.outputs.matrix }}

    steps:
      - name: Normalise tag
        id: tag
        env:
          RAW_TAG: ${{ inputs.tag }}
        run: |
          case "$RAW_TAG" in
            v*) TAG="$RAW_TAG" ;;
            *)  TAG="v$RAW_TAG" ;;
          esac
          echo "Using tag $TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Checkout tag
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ steps.tag.outputs.tag }}

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .tool-versions
          cache: 'pnpm'

      - name: Resolve profile, version and platform matrix
        id: resolve
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          REQUESTED_PROFILE: ${{ inputs.profile }}
          PLATFORM: ${{ inputs.platform }}
        run: |
          JSON=$(node scripts/release/tag-version.mjs "$TAG")
          echo "$JSON"

          if [ "$REQUESTED_PROFILE" = "auto" ]; then
            PROFILE=$(echo "$JSON" | jq -r .defaultProfile)
          else
            PROFILE="$REQUESTED_PROFILE"
          fi
          echo "Resolved profile: $PROFILE"

          ANDROID='{"platform":"android","runner":"ubuntu-latest"}'
          IOS='{"platform":"ios","runner":"macos-15"}'
          case "$PLATFORM" in
            android) MATRIX="{\"include\":[$ANDROID]}" ;;
            ios)     MATRIX="{\"include\":[$IOS]}" ;;
            both)    MATRIX="{\"include\":[$ANDROID,$IOS]}" ;;
            *)       echo "::error::Unknown platform $PLATFORM"; exit 1 ;;
          esac

          {
            echo "profile=$PROFILE"
            echo "marketing-version=$(echo "$JSON" | jq -r .marketingVersion)"
            echo "matrix=$MATRIX"
          } >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify package pins match the tag
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: node scripts/release/verify-pins.mjs "$TAG"

  build:
    name: Build ${{ matrix.platform }}
    needs: [prepare]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}

    steps:
      - name: Checkout tag
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Free disk space
        if: matrix.platform == 'android'
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          android: false
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Setup Java
        if: matrix.platform == 'android'
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        if: matrix.platform == 'android'
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4

      - name: Setup Xcode
        if: matrix.platform == 'ios'
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: latest-stable

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .tool-versions
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply marketing version
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: node scripts/release/apply-version.mjs "$TAG"

      - name: Build
        id: build
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
          PLATFORM: ${{ matrix.platform }}
          PROFILE: ${{ needs.prepare.outputs.profile }}
        run: |
          if [ "$PLATFORM" = "ios" ]; then
            EXT=ipa
          elif [ "$PROFILE" = "development" ]; then
            EXT=apk
          else
            EXT=aab
          fi
          OUTPUT="tracearr-${TAG}-${PLATFORM}.${EXT}"
          pnpm dlx "eas-cli@${EAS_CLI_VERSION}" build \
            --platform "$PLATFORM" \
            --profile "$PROFILE" \
            --local \
            --output "./${OUTPUT}" \
            --non-interactive
          echo "artifact=${OUTPUT}" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.platform }}-build
          path: ${{ steps.build.outputs.artifact }}
          retention-days: 30
