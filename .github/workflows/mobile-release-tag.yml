name: Mobile Release Tag

# Tags the tip of main for an app release. The app is versioned YYYY.M.N on
# its own (docs/superpowers/specs/2026-09-26-mobile-version-space-design.md);
# the pins on main say which Tracearr release it was built against, and the
# sync workflow owns those. A stable tag needs a stable pin and fresh store
# notes; a beta tag needs neither.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'App release tag to cut (e.g. v2026.9.1 or v2026.9.2-beta.1)'
        required: true
        type: string
      same_notes:
        description: 'Tag even though store/listings/en-US.json did not change since the last stable tag'
        required: false
        type: boolean
        default: false

concurrency:
  group: sync-tracearr-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  tag:
    name: Tag main for an app release
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .tool-versions
          cache: 'pnpm'

      - name: Resolve tag
        id: tag
        env:
          RAW_TAG: ${{ inputs.tag }}
        run: |
          JSON=$(node scripts/release/tag-version.mjs "$RAW_TAG")
          echo "$JSON"
          if [ "$(echo "$JSON" | jq -r .scheme)" != "app" ]; then
            echo "::error::App tags are YYYY.M.N (for example v2026.9.1). Server-shaped tags are not created here any more."
            exit 1
          fi
          {
            echo "tag=$(echo "$JSON" | jq -r .tag)"
            echo "prerelease=$(echo "$JSON" | jq -r .isPrerelease)"
          } >> "$GITHUB_OUTPUT"

      - name: Fail if the tag already exists here
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "::error::Tag $TAG already exists in this repo. Use the next number."
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify the pins on main can back this tag
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: node scripts/release/verify-pins.mjs "$TAG"

      - name: Fail if the store notes did not change since the last stable tag
        if: steps.tag.outputs.prerelease == 'false' && inputs.same_notes == false
        run: |
          LAST=$(git tag --list 'v*' | grep -v -- '-' | sort -V | tail -1)
          if [ -z "$LAST" ]; then
            echo "No stable tag yet, skipping the notes check"
            exit 0
          fi
          if git diff --quiet "$LAST" -- store/listings/en-US.json; then
            echo "::error::store/listings/en-US.json is unchanged since $LAST. Write the release notes for this version, or re-run with same_notes."
            exit 1
          fi
          echo "Store listing changed since $LAST"

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Tag
        id: push
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Tracearr mobile $TAG"
          git push origin "$TAG"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Summary
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          SHA: ${{ steps.push.outputs.sha }}
        run: |
          PINNED=$(jq -r '.dependencies["@tracearr/shared"]' package.json)
          {
            echo "## Tagged $TAG"
            echo ""
            echo "- Tagged the tip of main (\`$SHA\`)"
            echo "- Built against Tracearr \`$PINNED\`"
            echo ""
            echo "Build it with Mobile Release, tag \`$TAG\`, profile \`auto\`."
          } >> "$GITHUB_STEP_SUMMARY"
