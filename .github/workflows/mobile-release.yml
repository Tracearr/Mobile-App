name: Mobile Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tracearr tag to release (must be mirrored here first)'
        required: true
        type: string
      platform:
        description: 'Platform'
        required: true
        type: choice
        options: [all, android, ios]
        default: all
      profile:
        description: 'Build profile (auto derives from the tag)'
        required: true
        type: choice
        options: [auto, internal, beta, production]
        default: auto

concurrency:
  group: mobile-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout tag
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ inputs.tag }}

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .tool-versions
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify package pins match the tag
        env:
          TAG: ${{ inputs.tag }}
        run: node scripts/release/verify-pins.mjs "$TAG"

      - name: Resolve profile
        id: resolve
        env:
          TAG: ${{ inputs.tag }}
          REQUESTED_PROFILE: ${{ inputs.profile }}
        run: |
          JSON=$(node scripts/release/tag-version.mjs "$TAG")
          echo "$JSON"
          if [ "$REQUESTED_PROFILE" = "auto" ]; then
            PROFILE=$(echo "$JSON" | jq -r .defaultProfile)
          else
            PROFILE="$REQUESTED_PROFILE"
          fi
          echo "Resolved profile: $PROFILE"
          echo "profile=$PROFILE" >> "$GITHUB_OUTPUT"

      - name: Apply marketing version
        env:
          TAG: ${{ inputs.tag }}
        run: node scripts/release/apply-version.mjs "$TAG"

      - name: Setup Expo
        uses: expo/expo-github-action@eab7a230208c952974db8c3245cfd78402c7b385 # v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Deploy with fingerprint
        id: deploy
        uses: expo/expo-github-action/continuous-deploy-fingerprint@eab7a230208c952974db8c3245cfd78402c7b385 # v9
        with:
          profile: ${{ steps.resolve.outputs.profile }}
          branch: ${{ steps.resolve.outputs.profile }}
          platform: ${{ inputs.platform }}
          auto-submit-builds: true
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.EXPO_APPLE_APP_SPECIFIC_PASSWORD }}

      - name: Summary
        env:
          TAG: ${{ inputs.tag }}
          PROFILE: ${{ steps.resolve.outputs.profile }}
          FINGERPRINT: ${{ steps.deploy.outputs.fingerprint }}
          NEW_BUILD: ${{ steps.deploy.outputs.build-new-build }}
        run: |
          {
            echo "## Mobile Release"
            echo ""
            echo "- Tag: \`$TAG\`"
            echo "- Profile: \`$PROFILE\`"
            echo "- Fingerprint: \`$FINGERPRINT\`"
            echo "- New build: $NEW_BUILD"
          } >> "$GITHUB_STEP_SUMMARY"
