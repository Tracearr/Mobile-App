name: Mobile Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tracearr tag to build and submit (mirrored here first). Leave empty to publish an OTA update from ref instead.'
        required: false
        type: string
      ref:
        description: 'Branch, tag or commit to publish as an OTA update when tag is empty'
        required: false
        type: string
        default: main
      platform:
        description: 'Platform'
        required: true
        type: choice
        options: [all, android, ios]
        default: all
      profile:
        description: 'Build profile (auto derives from the tag)'
        required: true
        type: choice
        options: [auto, internal, beta, production]
        default: auto

concurrency:
  group: mobile-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Release
    if: inputs.tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Normalise tag
        id: tag
        env:
          RAW_TAG: ${{ inputs.tag }}
        run: |
          case "$RAW_TAG" in
            v*) TAG="$RAW_TAG" ;;
            *)  TAG="v$RAW_TAG" ;;
          esac
          echo "Using tag $TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Checkout tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ steps.tag.outputs.tag }}

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .tool-versions
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify package pins match the tag
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: node scripts/release/verify-pins.mjs "$TAG"

      - name: Resolve profile
        id: resolve
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          REQUESTED_PROFILE: ${{ inputs.profile }}
        run: |
          JSON=$(node scripts/release/tag-version.mjs "$TAG")
          echo "$JSON"
          if [ "$REQUESTED_PROFILE" = "auto" ]; then
            PROFILE=$(echo "$JSON" | jq -r .defaultProfile)
          else
            PROFILE="$REQUESTED_PROFILE"
          fi
          echo "Resolved profile: $PROFILE"
          echo "profile=$PROFILE" >> "$GITHUB_OUTPUT"
          echo "version=$(echo "$JSON" | jq -r .marketingVersion)" >> "$GITHUB_OUTPUT"

      - name: Apply marketing version
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: node scripts/release/apply-version.mjs "$TAG"

      - name: Setup Expo
        uses: expo/expo-github-action@eab7a230208c952974db8c3245cfd78402c7b385 # v9
        with:
          eas-version: 22.6.0
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Deploy with fingerprint
        id: deploy
        uses: expo/expo-github-action/continuous-deploy-fingerprint@eab7a230208c952974db8c3245cfd78402c7b385 # v9
        with:
          profile: ${{ steps.resolve.outputs.profile }}
          branch: ${{ steps.resolve.outputs.profile }}
          platform: ${{ inputs.platform }}
          # Every profile this workflow offers builds as the production environment,
          # so the action hashes app.config.js with the same env vars EAS does.
          environment: production
          auto-submit-builds: true
        env:
          # No app-specific password on purpose: with it set, eas-cli ignores the ASC
          # API key stored on EAS and fastlane cannot log in after the upload.
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      # Apple ties listing text to an App Store version, so the listings only go out
      # with a production build that creates one.
      - name: Push App Store listing
        if: steps.resolve.outputs.profile == 'production' && steps.deploy.outputs.ios-did-start-new-build == 'true'
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          # The ASC key stored on EAS has no team attached, so non-interactive runs need it here.
          EXPO_APPLE_TEAM_ID: 6DA3FJF5G5
          APP_VERSION: ${{ steps.resolve.outputs.version }}
          APPLE_REVIEW_NOTES: ${{ secrets.APPLE_REVIEW_NOTES }}
        # eas-cli exits 0 after "Metadata store config errors found" and pushes
        # nothing, so the success line is the only proof the listing went out.
        run: |
          set -o pipefail
          eas metadata:push --profile production --non-interactive 2>&1 | tee metadata-push.log
          grep -q "Store configuration is synced" metadata-push.log

      - name: Push Play listing
        if: steps.resolve.outputs.profile == 'production' && steps.deploy.outputs.android-did-start-new-build == 'true'
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
          APP_VERSION: ${{ steps.resolve.outputs.version }}
        run: node scripts/release/sync-play-listing.mjs

      - name: Summary
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          PROFILE: ${{ steps.resolve.outputs.profile }}
          IOS_FINGERPRINT: ${{ steps.deploy.outputs.ios-fingerprint }}
          ANDROID_FINGERPRINT: ${{ steps.deploy.outputs.android-fingerprint }}
          IOS_NEW_BUILD: ${{ steps.deploy.outputs.ios-did-start-new-build }}
          ANDROID_NEW_BUILD: ${{ steps.deploy.outputs.android-did-start-new-build }}
        run: |
          {
            echo "## Mobile Release"
            echo ""
            echo "- Tag: \`$TAG\`"
            echo "- Profile: \`$PROFILE\`"
            echo "- iOS fingerprint: \`$IOS_FINGERPRINT\`"
            echo "- Android fingerprint: \`$ANDROID_FINGERPRINT\`"
            echo "- New iOS build: $IOS_NEW_BUILD"
            echo "- New Android build: $ANDROID_NEW_BUILD"
          } >> "$GITHUB_STEP_SUMMARY"

  # JS-only hotfixes: the builds already in the stores pick this up on next
  # launch, as long as the runtime fingerprint still matches one of them.
  update:
    name: OTA update
    if: inputs.tag == ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      POSTHOG_CLI_API_KEY: ${{ secrets.POSTHOG_CLI_API_KEY }}
      POSTHOG_CLI_HOST: ${{ secrets.POSTHOG_CLI_HOST }}
      POSTHOG_CLI_PROJECT_ID: ${{ secrets.POSTHOG_CLI_PROJECT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .tool-versions
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck, lint and test
        run: |
          pnpm typecheck
          pnpm lint
          pnpm test

      - name: Resolve channel
        id: channel
        env:
          REQUESTED_PROFILE: ${{ inputs.profile }}
        run: |
          CHANNEL="$REQUESTED_PROFILE"
          if [ "$CHANNEL" = "auto" ]; then CHANNEL=production; fi
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"

      - name: Setup Expo
        uses: expo/expo-github-action@eab7a230208c952974db8c3245cfd78402c7b385 # v9
        with:
          eas-version: 22.6.0
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Publish update
        id: publish
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          CHANNEL: ${{ steps.channel.outputs.channel }}
          PLATFORM: ${{ inputs.platform }}
        run: |
          MESSAGE="$(git log -1 --pretty=%s)"
          eas update --channel "$CHANNEL" --platform "$PLATFORM" --environment production \
            --message "$MESSAGE" --non-interactive --json > update.json
          node -e '
            const updates = JSON.parse(require("fs").readFileSync("update.json", "utf8"));
            const runtimes = [...new Set(updates.map((u) => u.runtimeVersion))];
            for (const u of updates) console.log(`${u.platform}: group ${u.group} runtime ${u.runtimeVersion}`);
            require("fs").appendFileSync(process.env.GITHUB_OUTPUT, `runtimes=${runtimes.join(" ")}\n`);
          '

      - name: Upload source maps to PostHog
        if: env.POSTHOG_CLI_API_KEY != ''
        run: pnpm exec posthog-cli hermes upload --directory dist

      # eas update publishes to a runtime whether or not any build runs it, so
      # a native change would otherwise ship to nobody without a word.
      - name: Confirm a build on this channel runs the update
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          CHANNEL: ${{ steps.channel.outputs.channel }}
          RUNTIMES: ${{ steps.publish.outputs.runtimes }}
        run: |
          for RUNTIME in $RUNTIMES; do
            COUNT=$(eas build:list --channel "$CHANNEL" --status finished --runtime-version "$RUNTIME" \
              --limit 1 --json --non-interactive | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).length))')
            if [ "$COUNT" = "0" ]; then
              echo "::error::No finished $CHANNEL build has runtime $RUNTIME. Native code changed; this needs a release, not an update."
              exit 1
            fi
            echo "runtime $RUNTIME has a finished $CHANNEL build"
          done

      - name: Summary
        env:
          REF: ${{ inputs.ref }}
          CHANNEL: ${{ steps.channel.outputs.channel }}
          RUNTIMES: ${{ steps.publish.outputs.runtimes }}
        run: |
          {
            echo "## OTA update"
            echo ""
            echo "- Ref: \`$REF\`"
            echo "- Channel: \`$CHANNEL\`"
            echo "- Runtime: \`$RUNTIMES\`"
          } >> "$GITHUB_STEP_SUMMARY"
